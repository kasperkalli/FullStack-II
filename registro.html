<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - DeliveryApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-danger"><div class="container justify-content-center"><a class="navbar-brand fw-bold" href="index.html">🍔 DeliveryApp</a></div></nav>
    <main class="container d-flex justify-content-center align-items-center py-5">
        <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4 fw-bold">Registro de Usuario</h2>
            <form id="form-registro">
                <div class="mb-3"><input type="text" id="nombre" class="form-control" placeholder="Nombre Completo" required></div>
                <div class="mb-3"><input type="email" id="correo-reg" class="form-control" placeholder="Correo (@duoc.cl, @gmail.com)" required></div>
                <div class="mb-3"><input type="password" id="pass-reg" class="form-control" placeholder="Contraseña (4-10 char)" required></div>
                <div class="mb-3"><input type="password" id="pass-conf" class="form-control" placeholder="Confirmar Contraseña" required></div>
                <div class="mb-3"><input type="text" id="telefono" class="form-control" placeholder="Teléfono (Opcional)"></div>
                <div class="row g-2 mb-3">
                    <div class="col"><select id="region" class="form-select"><option>Región Metropolitana</option></select></div>
                    <div class="col"><select id="comuna" class="form-select"><option>Santiago</option></select></div>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Registrar</button>
            </form>
        </div>
    </main>
    <script src="scripts/registro.js"></script>
</body>
</html>
