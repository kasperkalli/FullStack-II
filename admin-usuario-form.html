<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - DeliveryApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex" style="height: 100vh; overflow: hidden;">
    <aside class="bg-dark text-white p-3 d-flex flex-column" style="width: 250px;">
        <h3 class="fw-bold mb-4 text-danger">Panel Admin</h3>
        <nav class="nav flex-column gap-2">
            <a class="nav-link text-white bg-danger rounded" href="admin-home.html">Dashboard</a>
            <a class="nav-link text-white" href="admin-productos.html">Lista Productos</a>
            <a class="nav-link text-white" href="admin-producto-form.html">Nuevo Producto</a>
            <a class="nav-link text-white" href="admin-usuarios.html">Lista Usuarios</a>
            <a class="nav-link text-white" href="admin-usuario-form.html">Nuevo Usuario</a>
        </nav>
        <a href="index.html" class="btn btn-outline-light mt-auto">← Volver a Tienda</a>
    </aside>
    <main class="flex-fill p-5 bg-light overflow-auto">
        <h1 class="mb-4 fw-bold">Registrar Nuevo Usuario</h1>
        <div class="card shadow-sm p-4" style="max-width: 600px;">
            <form id="form-admin-usuario">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="RUN (Ej: 19011022K sin puntos ni guion)" required>
                </div>
                
                <div class="row g-3 mb-3">
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Nombre (Max 50)" required>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Apellidos (Max 100)" required>
                    </div>
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Correo (@duoc.cl, @gmail.com)" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col">
                        <label class="form-label small text-muted mb-0">Fecha de Nacimiento</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col">
                        <label class="form-label small text-muted mb-0">Rol en el Sistema</label>
                        <select class="form-select">
                            <option value="Admin">Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col">
                        <select class="form-select">
                            <option>Región Metropolitana</option>
                            <option>Valparaíso</option>
                        </select>
                    </div>
                    <div class="col">
                        <select class="form-select">
                            <option>Santiago</option>
                            <option>Providencia</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Dirección completa (Max 300)" required>
                </div>

                <button type="submit" class="btn btn-danger w-100 fw-bold">Guardar Usuario</button>
            </form>
        </div>
    </main>
</body>
</html>
