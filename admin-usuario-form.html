<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - DeliveryApp</title>
    <style>
        body { display: flex; margin: 0; font-family: sans-serif; height: 100vh; }
        .sidebar { width: 250px; background: #2f3542; color: white; padding: 20px; }
        .sidebar a { display: block; color: white; text-decoration: none; margin-bottom: 15px; }
        .content { flex: 1; padding: 40px; background: #f1f2f6; overflow-y: auto; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Panel Admin</h2>
        <nav>
            <a href="admin-home.html">Dashboard</a>
            <a href="admin-productos.html">Lista de Productos</a>
            <a href="admin-producto-form.html">Nuevo Producto</a>
            <a href="admin-usuarios.html">Lista de Usuarios</a>
            <a href="admin-usuario-form.html">Nuevo Usuario</a>
            <a href="index.html" style="margin-top: 50px; color: #ff4757;">← Ir a la Tienda</a>
        </nav>
    </aside>
    <main class="content">
        <h1>NUEVO USUARIO</h1>
        <form style="display: flex; flex-direction: column; width: 400px; gap: 10px;">
            <input type="text" placeholder="RUN (Ej: 19011022K sin guion)" required>
            <input type="text" placeholder="Nombre (Max 50)" required>
            <input type="text" placeholder="Apellidos (Max 100)" required>
            <input type="email" placeholder="Correo (@duoc.cl, @gmail.com)" required>
            <input type="date" title="Fecha Nacimiento">
            <select title="Tipo de Usuario"><option>Administrador</option><option>Vendedor</option><option>Cliente</option></select>
            <select title="Región"><option>Región Metropolitana</option></select>
            <select title="Comuna"><option>Santiago</option></select>
            <input type="text" placeholder="Dirección (Max 300)" required>
            <button type="submit" style="padding: 10px; background: black; color: white;">Guardar Usuario</button>
        </form>
    </main>
</body>
</html>
