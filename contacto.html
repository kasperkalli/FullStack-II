<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - DeliveryApp</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <div class="logo"><h2>🍔 DeliveryApp</h2></div>
        <nav><ul><li><a href="index.html">Home</a></li></ul></nav>
    </header>
    <main style="padding: 50px; display: flex; justify-content: center;">
        <form id="form-contacto" class="card-producto" style="width: 400px;">
            <h2>Formulario de Contacto</h2>
            <input type="text" id="nombre-cont" placeholder="Nombre (Max 100)" required style="width:100%; margin-top:10px; padding:5px;">
            <input type="email" id="correo-cont" placeholder="Correo" required style="width:100%; margin-top:10px; padding:5px;">
            <textarea id="comentario" placeholder="Comentario (Max 500)" required style="width:100%; margin-top:10px; padding:5px; height: 100px;"></textarea>
            
            <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">Enviar Mensaje</button>
        </form>
    </main>
    <footer><p>&copy; 2024 DeliveryApp</p></footer>
    <script src="scripts/contacto.js"></script>
</body>
</html>
