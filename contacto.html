<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - DeliveryApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-dark bg-danger"><div class="container"><a class="navbar-brand fw-bold" href="index.html">🍔 DeliveryApp</a></div></nav>
    <main class="flex-grow-1 container d-flex justify-content-center align-items-center py-5">
        <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4 fw-bold">Contáctanos</h2>
            <form id="form-contacto">
                <div class="mb-3"><input type="text" id="nombre-cont" class="form-control" placeholder="Nombre (Max 100)" required></div>
                <div class="mb-3"><input type="email" id="correo-cont" class="form-control" placeholder="Correo (@duoc.cl, @gmail.com)" required></div>
                <div class="mb-3"><textarea id="comentario" class="form-control" placeholder="Tu mensaje aquí (Max 500)" rows="4" required></textarea></div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Enviar Mensaje</button>
            </form>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3"><p class="mb-0">&copy; 2024 DeliveryApp</p></footer>
    <script src="scripts/contacto.js"></script>
</body>
</html>
