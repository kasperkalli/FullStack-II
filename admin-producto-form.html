<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - DeliveryApp</title>
    <style>
        body { display: flex; margin: 0; font-family: sans-serif; height: 100vh; }
        .sidebar { width: 250px; background: #2f3542; color: white; padding: 20px; }
        .sidebar a { display: block; color: white; text-decoration: none; margin-bottom: 15px; }
        .content { flex: 1; padding: 40px; background: #f1f2f6; overflow-y: auto; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Panel Admin</h2>
        <nav>
            <a href="admin-home.html">Dashboard</a>
            <a href="admin-productos.html">Lista de Productos</a>
            <a href="admin-producto-form.html">Nuevo Producto</a>
            <a href="admin-usuarios.html">Lista de Usuarios</a>
            <a href="admin-usuario-form.html">Nuevo Usuario</a>
            <a href="index.html" style="margin-top: 50px; color: #ff4757;">← Ir a la Tienda</a>
        </nav>
    </aside>
    <main class="content">
        <h1>NUEVO PRODUCTO</h1>
        <form style="display: flex; flex-direction: column; width: 400px; gap: 10px;">
            <input type="text" placeholder="Código (Min 3)" required>
            <input type="text" placeholder="Nombre (Max 100)" required>
            <textarea placeholder="Descripción (Opcional, Max 500)"></textarea>
            <input type="number" placeholder="Precio (Min 0)" required>
            <input type="number" placeholder="Stock (Min 0)" required>
            <input type="number" placeholder="Stock Crítico (Opcional)">
            <select><option>Comida Rápida</option><option>Sushi</option></select>
            <input type="file" title="Imagen">
            <button type="submit" style="padding: 10px; background: black; color: white;">Guardar Producto</button>
        </form>
    </main>
</body>
</html>
