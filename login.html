<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - DeliveryApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-danger"><div class="container justify-content-center"><a class="navbar-brand fw-bold" href="index.html">🍔 DeliveryApp</a></div></nav>
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>
            <form id="form-login">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico:</label>
                    <input type="email" id="correo" class="form-control" placeholder="ejemplo@duoc.cl">
                    <div id="error-correo" class="text-danger small mt-1" style="display: none;"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña:</label>
                    <input type="password" id="password" class="form-control">
                    <div id="error-password" class="text-danger small mt-1" style="display: none;"></div>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Ingresar</button>
            </form>
        </div>
    </main>
    <script src="scripts/login.js"></script>
</body>
</html>
