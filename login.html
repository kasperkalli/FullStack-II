<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DeliveryApp</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <div class="logo"><h2>🍔 DeliveryApp</h2></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; padding: 50px;">
        <div class="card-producto" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
            
            <form id="form-login">
                <div style="margin-bottom: 15px;">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" style="width: 100%; padding: 8px; margin-top: 5px;" placeholder="ejemplo@duoc.cl">
                    <span id="error-correo" style="color: red; font-size: 0.8rem; display: none;"></span>
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" style="width: 100%; padding: 8px; margin-top: 5px;">
                    <span id="error-password" style="color: red; font-size: 0.8rem; display: none;"></span>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Ingresar</button>
            </form>
        </div>
    </main>
    <script src="scripts/login.js"></script>
</body>
</html>
