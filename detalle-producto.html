<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Producto - DeliveryApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="productos.html">← Volver al Menú</a>
            <div class="d-flex gap-2 ms-auto"><a href="carrito.html" class="btn btn-light text-danger fw-bold">🛒 (<span id="cart-count">0</span>)</a></div>
        </div>
    </nav>
    <main class="flex-grow-1 container py-5">
        <div class="row g-5 align-items-center bg-white p-5 rounded shadow-sm">
            <div class="col-md-6 text-center">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" class="img-fluid rounded" alt="Producto">
            </div>
            <div class="col-md-6">
                <h1 class="fw-bold">Hamburguesa Doble Queso</h1>
                <h2 class="text-success fw-bold mb-3">$6.500</h2>
                <p class="text-muted mb-4">Deliciosa hamburguesa con doble carne de res, queso cheddar fundido, lechuga fresca y nuestra salsa especial.</p>
                <div class="d-flex align-items-center gap-3 mb-4">
                    <label class="fw-bold">Cantidad:</label>
                    <input type="number" class="form-control w-25" value="1" min="1" id="cantidad-prod">
                </div>
                <button class="btn btn-danger btn-lg w-100 fw-bold" onclick="alert('Añadido al carrito')">Añadir al Carrito</button>
            </div>
        </div>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
